<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Submit a Property | Compare Projects</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="styles.css">
</head>
<body class="public-page">
<main class="public-wrap">
  <div class="brand public-brand"><div class="brand-mark">CP</div><div><b>Compare Projects</b><small>FOR AGENTS &amp; BROKERS</small></div></div>
  <div class="panel form-panel">
    <div class="form-heading"><div class="form-symbol agent-symbol">♧</div><div><h3>Agent / broker property submission</h3><p>Register your details and the property you represent. Our team reviews every submission.</p></div></div>
    <form data-endpoint="/public/broker" novalidate>
      <div class="field-grid">
        <label>Full name <span>*</span><input name="name" required minlength="2" maxlength="100" autocomplete="name" placeholder="Your full name"></label>
        <label>Agency / brokerage name <span>*</span><input name="agencyName" required maxlength="150" autocomplete="organization" placeholder="e.g. Skyline Realty"></label>
        <label>Phone number <span>*</span><input name="phone" required type="tel" pattern="\+?[0-9 \(\)\-]{10,20}" autocomplete="tel" placeholder="+91 98765 43210"></label>
        <label>Email address <span>*</span><input name="email" type="email" required maxlength="254" autocomplete="email" placeholder="you@agency.com"></label>
        <label>Agent RERA number<input name="reraNumber" maxlength="60" placeholder="e.g. A51800012345"></label>
        <label>Property / listing name <span>*</span><input name="propertyTitle" required maxlength="150" placeholder="e.g. Bandra Office Space"></label>
        <label>Property type <span>*</span><select name="propertyType" required><option value="">Select property type</option><option>Apartment</option><option>Villa</option><option>Plot / Land</option><option>Commercial</option></select></label>
        <label>Listing type <span>*</span><select name="listingType" required><option value="">Sale or rent?</option><option>Sale</option><option>Rent / Lease</option></select></label>
        <label>Property location <span>*</span><input name="location" required maxlength="150" placeholder="Locality, city"></label>
        <label>Expected price / rent<input name="expectedPrice" maxlength="60" placeholder="e.g. ₹1.2 crore or ₹45,000/month"></label>
        <label class="wide">Listing details / reference ID<textarea name="message" rows="3" maxlength="2000" placeholder="Size, floor, amenities, your internal reference…"></textarea></label>
        <label class="hp" aria-hidden="true">Leave this empty<input name="website" tabindex="-1" autocomplete="off"></label>
      </div>
      <label class="consent"><input name="contactConsent" type="checkbox" required> I agree to be contacted about this submission. <span>*</span></label>
      <div class="form-actions"><button type="reset" class="btn btn-light">Clear form</button><button class="btn btn-primary" type="submit">Submit property <span>→</span></button></div>
      <div id="formFeedback" class="form-feedback hidden" role="status" aria-live="polite"></div>
    </form>
  </div>
  <p class="public-foot">Also: <a href="customer.html">Customer property enquiry</a> · <a href="developer.html">Developer project submission</a></p>
</main>
<script src="config.js"></script>
<script src="public-form.js"></script>
</body></html>
